<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Avarenne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="background"></canvas><canvas id="smoke"></canvas><div class="vignette"></div><div class="grain"></div>
<div id="app">
  <section class="scene active" id="scene-title"><div class="scene-content brand-reveal" id="brandReveal"><div class="kicker" id="campaignKickerDisplay"></div><div class="ornament"><span>✦</span></div><div class="brand" id="campaignTitleDisplay"></div><div class="brand-sub" id="campaignSubtitleDisplay"></div></div></section>
  <section class="scene" id="scene-prelude"><div class="scene-content"><div class="kicker" id="preludeKickerDisplay"></div><h1 class="chapter-title" id="preludeTitleDisplay"></h1><div class="rule"></div><div class="teaser-copy" id="preludeLines"></div></div></section>
  <section class="scene" id="scene-firstpressing"><div class="scene-content"><div class="kicker" id="pressingKickerDisplay"></div><h1 class="chapter-title" id="pressingTitleDisplay"></h1><div class="rule"></div><div class="teaser-copy" id="pressingLines"></div><div class="countdown-box"><div class="countdown-label" id="countdownLabelDisplay"></div><div class="countdown" id="countdown">00<small>D</small> 00<small>H</small> 00<small>M</small> 00<small>S</small></div></div></div></section>
</div>
<script src="app.js"></script>
</body></html>
